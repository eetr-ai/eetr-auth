name: Docs

# Builds apps/docs (Fumadocs static export) and deploys it to GitHub Pages.
# - workflow_dispatch: trigger the initial publish (and any manual re-publish).
# - workflow_call: invoked by release-please.yml on each release so the docs
#   ship with every release.
on:
  workflow_dispatch:
  workflow_call:

# GitHub Pages deployment needs these; contents:read to check out the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # The `github-pages` environment block is optional per actions/deploy-pages
    # (pages:write + id-token:write are what's required) and is omitted so editors
    # don't flag an environment that only exists once Pages is enabled. The deploy
    # still targets the github-pages environment by default; the URL is in the
    # deploy step's `page_url` output.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build docs (static export)
        run: npm run build --workspace=apps/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out
      - id: deployment
        uses: actions/deploy-pages@v4
