name: Coverage Badge

# Recomputes the README coverage badge whenever main changes.
#
# Wired to gist https://gist.github.com/juancavallotti/6c3e9b0934625c845df2ffb18bfe4f6d
# (file eetr-auth-coverage.json), authenticated with the `GIST_SECRET` repo
# secret. To rotate that secret to a least-privilege token, create a classic
# PAT with ONLY the `gist` scope and re-set GIST_SECRET — no workflow change
# needed.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Compute aggregate line coverage
        id: cov
        run: |
          PCT=$(node -e "
            const fs = require('fs');
            const files = [
              'apps/auth/coverage/coverage-summary.json',
              'packages/eetr-auth-client/coverage/coverage-summary.json',
            ];
            let covered = 0, total = 0;
            for (const f of files) {
              const lines = JSON.parse(fs.readFileSync(f, 'utf8')).total.lines;
              covered += lines.covered;
              total += lines.total;
            }
            console.log(total === 0 ? '0' : (covered / total * 100).toFixed(2));
          ")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "Aggregate line coverage: $PCT%"

      - name: Write coverage badge to gist
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 6c3e9b0934625c845df2ffb18bfe4f6d
          filename: eetr-auth-coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.pct }}%
          valColorRange: ${{ steps.cov.outputs.pct }}
          minColorRange: 50
          maxColorRange: 90
