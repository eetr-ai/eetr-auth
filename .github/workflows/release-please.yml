name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # Release-please PRs are opened with the default GITHUB_TOKEN, so CI never runs on them.
  # Check here instead, on the push that merges one, before the tag is cut: the newest
  # schema patch must ship in the release whose number it carries.
  schema-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the check diffs db/patches against the previous release.
          fetch-depth: 0

      - name: Check schema patch matches the release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Diff the whole push, not just its last commit: a push carrying several commits
          # could bump the manifest in an earlier one. Fall back to HEAD^ when there is no
          # usable "before" (a new branch reports all zeros).
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          if git diff --name-only "$base" HEAD | grep -qx '.release-please-manifest.json'; then
            node scripts/check-schema-version.mjs --release
          else
            echo "Not a release commit; nothing to check."
          fi

  release-please:
    needs: schema-version
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Deploy the docs to GitHub Pages whenever a release is actually cut. This runs
  # in the same push-to-main workflow run (not a separate `on: release` trigger),
  # because releases created by the default GITHUB_TOKEN do not trigger further
  # workflow runs.
  deploy-docs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  # Publish the JS client to npm on the same release, for the same reason the
  # docs deploy lives here: releases created by the default GITHUB_TOKEN do not
  # trigger further workflow runs.
  publish-client:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-client.yml
    secrets: inherit
